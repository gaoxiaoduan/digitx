name: Scheduled Domain Scan

on:
  schedule:
    # Run every 6 hours (e.g. 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      runtime:
        description: '测试运行时间(分钟) / Max runtime in minutes'
        required: false
        default: '5'
        type: string

permissions:
  contents: write # Need permission to commit the scan results

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run Domain Scanner
      env:
        MAX_RUN_TIME_MINUTES: ${{ github.event.inputs.runtime || '30' }}
      run: node cron_scan.js

    - name: Commit and Push Scan Results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Force add domains_db.json in case it's in gitignore
        git add -f domains_db.json public/data/domains.json public/data/status.json
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update domain scan results" && git push)
