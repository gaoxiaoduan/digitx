name: Scheduled Domain Scan

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Domain Scanner & Sync to Cloudflare KV
        env:
          API_URL: ${{ secrets.DIGITX_API_URL }}
          SYNC_SECRET: ${{ secrets.DIGITX_SYNC_SECRET }}
        run: pnpm scan
